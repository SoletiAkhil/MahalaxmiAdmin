<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mahalaxmi Pickels — Admin</title>

<link rel="icon" href="./logo.jpeg" />

<style>
/* ===== PAGE LOADER ===== */
#pageLoader{
  position: fixed;
  inset: 0;
  background: #f7f8fb;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#pageLoader img{
  width: 90px;
  height: 90px;
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
}

/* smooth spin */
@keyframes spin{
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* hide loader smoothly */
#pageLoader.hide{
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

*, *::before, *::after {
  box-sizing: border-box;
}
:root{
  --accent:#5c6fd6;
  --bg:#f7f8fb;
  --card:#ffffff;
  --radius:16px;
  --shadow:0 12px 30px rgba(0,0,0,0.08);
}

body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:var(--bg);
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:16px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:14px 18px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.brand img{
  width:56px;
  height:56px;
  border-radius:12px;
}

.actions{
  display:flex;
  gap:10px;
}

.btn{
  padding:10px 18px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  background:var(--accent);
  color:#fff;
}

.btn.secondary{
  background:#fff;
  color:var(--accent);
  border:1px solid #e5e7eb;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-top:20px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
}

.search-row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}

.search-row input,
.search-row select{
  max-width:280px;
}

@media (max-width:768px){
  .search-row{
    flex-direction:column;
    align-items:stretch;
  }

  .search-row input,
  .search-row select{
    max-width:100%;
  }
}


.list{
  max-height:320px;
  overflow:auto;
}

.item{
  display:flex;
  gap:12px;
  padding:12px;
  border:1px solid #f1f5f9;
  border-radius:14px;
  margin-bottom:10px;
}

.thumb{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-box{
  background:#fff;
  width:520px;
  max-width:95%;
  border-radius:22px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  font-size:22px;
  cursor:pointer;
  background:none;
  border:none;
}

label{display:block;margin-top:12px}
input,textarea,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-top:6px;
}

.preview{
  margin-top:10px;
}

.preview img{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:12px;
}

.controls{
  margin-top:18px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
/* ================= MOBILE IMPROVEMENTS ================= */
@media (max-width: 768px){

  /* HEADER */
  header{
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .actions{
    width: 100%;
    justify-content: space-between;
  }

  .btn{
    flex: 1;
    justify-content: center;
    padding: 12px;
    font-size: 15px;
  }

  /* LIST ITEMS */
  .item{
    flex-direction: column;
    align-items: flex-start;
  }

  .item img.thumb{
    width: 100%;
    height: 160px;
  }

  /* MODAL */
  .modal-box{
    width: 95%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 18px;
  }

  .modal-header h3{
    font-size: 18px;
  }

  input, textarea, select{
    font-size: 16px; /* prevents iOS zoom */
    padding: 12px;
  }

  /* IMAGE PREVIEW */
  .preview img{
    max-height: 220px;
  }

  /* BUTTONS INSIDE MODAL */
  .controls{
    flex-direction: column;
  }

  .controls .btn{
    width: 100%;
  }
}
.item button{
  white-space:nowrap;
}

@media (max-width:768px){
  .item button{
    width:100%;
  }
}

.modal-box input,
.modal-box textarea,
.modal-box select {
  width: 100%;
  max-width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  margin-top: 6px;
  font-size: 15px;
}

.modal-box{
  background:#fff;
  width:520px;
  max-width:95%;
  border-radius:22px;
  padding:20px;
  overflow: hidden; /* 🔥 important */
}
.modal-box input[type="file"] {
  padding: 8px;
}

@media (max-width: 768px){
  .modal-box{
    width: 95%;
    padding: 16px;
  }

  .modal-box input,
  .modal-box textarea,
  .modal-box select{
    font-size: 16px; /* prevents zoom + overflow */
  }
}
/* IMAGE UPLOAD LOADER */
.upload-loader{
  display:flex;
  align-items:center;
  justify-content:center;
  height:120px;
  border-radius:12px;
  background:#f3f4f6;
  color:#6b7280;
  font-size:14px;
}

.upload-loader::after{
  content:"";
  width:28px;
  height:28px;
  border:3px solid #d1d5db;
  border-top-color: var(--accent);
  border-radius:50%;
  margin-left:10px;
  animation: spin 0.8s linear infinite;
}

</style>
</head>

<body>
<!-- PAGE LOADER -->
<div id="pageLoader">
  <img src="./logo.jpeg" alt="Loading..." />
</div>

<div class="container">

<header>
  <div class="brand">
    <img src="./logo.jpeg">
    <div>
      <b>Mahalaxmi Pickels</b><br>
      <small>Admin Panel</small>
    </div>
  </div>
  <div class="actions">
    <button class="btn" onclick="openCategoryModal()">➕ Add Category</button>
    <button class="btn" onclick="openProductModal()">➕ Add Product</button>
  </div>
</header>

<div class="grid">
  <div class="card">
    <h3>Categories</h3>

    <!-- SEARCH -->
    <input
      type="text"
      id="categorySearch"
      placeholder="Search categories..."
      style="margin-bottom:12px"
    >

    <div class="list" id="categoriesList">Loading…</div>
  </div>
  <div class="card">
    <h3>Products</h3>

    <!-- SEARCH -->
    <div class="search-row">
      <input
        type="text"
        id="productSearch"
        placeholder="Search products..."
      >

      <select id="productCategoryFilter">
        <option value="">All Categories</option>
      </select>
    </div>


    <div class="list" id="productsList">Loading…</div>
  </div>
  <!-- SITE SETTINGS -->
  <div class="card">
    <h3>Site Settings</h3>

    <label>WhatsApp Number</label>
    <input id="set_whatsapp">

    <label>Primary Phone</label>
    <input id="set_phone1">

    <label>Secondary Phone</label>
    <input id="set_phone2">

    <label>Email</label>
    <input id="set_email">

    <label>Address</label>
    <textarea id="set_address"></textarea>

    <label>Google Map URL</label>
    <input id="set_map">

    <label>Facebook URL</label>
    <input id="set_fb">

    <label>Instagram URL</label>
    <input id="set_insta">

    <label>Twitter / X URL</label>
    <input id="set_tw">

    <div class="controls">
      <button class="btn" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

</div>
</div>

<!-- CATEGORY MODAL -->
<div class="modal" id="categoryModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="catTitle">Add Category</h3>
      <button class="close" onclick="closeCategoryModal()">×</button>
    </div>

    <input id="cat_id" type="hidden">

    <label>Name</label>
    <input id="cat_name">

    <label>Description</label>
    <textarea id="cat_desc"></textarea>

    <label>Image</label>
    <input type="file" id="cat_image_file" accept="image/*">
    <!-- <button class="btn secondary" onclick="uploadCategoryImage()">Upload Image</button> -->
    <div class="preview" id="cat_preview"></div>

    <div class="controls">
      <button class="btn" onclick="saveCategory()">Save</button>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="prodTitle">Add Product</h3>
      <button class="close" onclick="closeProductModal()">×</button>
    </div>

    <input id="prod_id" type="hidden">

    <label>Name</label>
    <input id="prod_name">

    <label>Category</label>
    <select id="prod_category"></select>

    <label>Price</label>
    <input type="number" id="prod_price">

    <label>Image</label>
    <input type="file" id="prod_image_file" accept="image/*">
    <!-- <button class="btn secondary" onclick="uploadProductImage()">Upload Image</button> -->
    <div class="preview" id="prod_preview"></div>

    <div class="controls">
      <button class="btn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script>
const client = supabase.createClient(
  "https://mfbgnapfarkguogklunk.supabase.co",
  "sb_publishable_jhUG7EagF5vX6qi2wcxEwA_UB-ExHO8"
);

const SETTINGS_ID = "mahalaxmi";

const BUCKET = "product-images";

let categories=[], products=[];
let catImageUrl="", prodImageUrl="";

/* UPLOAD */
async function uploadFile(file, folder){
  const path = `${folder}/${Date.now()}-${file.name}`;
  const { error } = await client.storage.from(BUCKET).upload(path, file);
  if(error) throw error;
  return client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

// async function uploadCategoryImage(){
//   const f = cat_image_file.files[0];
//   if(!f) return alert("Choose image");
//   catImageUrl = await uploadFile(f,"categories");
//   cat_preview.innerHTML = `<img src="${catImageUrl}">`;
// }

document.getElementById("cat_image_file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    cat_image_file.disabled = true;
    cat_preview.innerHTML = `<div class="upload-loader">Uploading image</div>`;

    catImageUrl = await uploadFile(file, "categories");

    cat_preview.innerHTML = `<img src="${catImageUrl}">`;
  } catch (err) {
    alert("Image upload failed");
    console.error(err);
    cat_preview.innerHTML = "";
  } finally {
    cat_image_file.disabled = false;
  }
});



// async function uploadProductImage(){
//   const f = prod_image_file.files[0];
//   if(!f) return alert("Choose image");
//   prodImageUrl = await uploadFile(f,"products");
//   prod_preview.innerHTML = `<img src="${prodImageUrl}">`;
// }

document.getElementById("prod_image_file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    prod_image_file.disabled = true;
    prod_preview.innerHTML = `<div class="upload-loader">Uploading image</div>`;

    prodImageUrl = await uploadFile(file, "products");

    prod_preview.innerHTML = `<img src="${prodImageUrl}">`;
  } catch (err) {
    alert("Image upload failed");
    console.error(err);
    prod_preview.innerHTML = "";
  } finally {
    prod_image_file.disabled = false;
  }
});



/* MODALS */
function openCategoryModal(){
  categoryModal.style.display = "flex";

  // 🔥 reset image input so change event always fires
  // cat_image_file.value = "";
  // cat_preview.innerHTML = "";
  // catImageUrl = "";
}

function closeCategoryModal(){categoryModal.style.display="none"}
function openProductModal(){
  productModal.style.display = "flex";

  // 🔥 reset image input so change event always fires
//   prod_image_file.value = "";
//   prod_preview.innerHTML = "";
//   prodImageUrl = "";
// 
}

function closeProductModal(){productModal.style.display="none"}

/* LOAD */
// async function loadAll(){
//   categories = (await client.from("categories").select("*")).data || [];
//   products   = (await client.from("products").select("*")).data || [];

//   productCategoryFilter.innerHTML =
//   `<option value="">All Categories</option>` +
//   categories.map(c =>
//     `<option value="${c.id}">${escapeHtml(c.name)}</option>`
//   ).join("");

//   renderCategories(categories);
//   renderProducts(products);

//   prod_category.innerHTML = categories
//     .map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`)
//     .join("");
// }
async function loadAll(){
  try{
    const catRes = await client.from("categories").select("*");
    const prodRes = await client.from("products").select("*");

    categories = catRes.data || [];
    products   = prodRes.data || [];

    renderCategories(categories);
    renderProducts(products);

    prod_category.innerHTML = categories
      .map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`)
      .join("");

  } finally {
    // 🔥 hide loader after everything is ready
    const loader = document.getElementById("pageLoader");
    loader.classList.add("hide");

    // remove from DOM after animation
    setTimeout(() => loader.remove(), 400);
  }
}


function applyProductFilters(){
  const q = productSearch.value.toLowerCase();
  const catId = productCategoryFilter.value;

  renderProducts(
    products.filter(p => {
      const matchesText =
        (p.name + " " + (p.description || ""))
          .toLowerCase()
          .includes(q);

      const matchesCategory =
        !catId || p.category_id === catId;

      return matchesText && matchesCategory;
    })
  );
}

productSearch.addEventListener("input", applyProductFilters);
productCategoryFilter.addEventListener("change", applyProductFilters);


function renderCategories(list){
  categoriesList.innerHTML = list.map(c => `
    <div class="item">
      <div style="flex:1">
        <b>${escapeHtml(c.name)}</b>
        <div style="margin-top:6px;display:flex;gap:8px">
          <button class="btn secondary" onclick="editCategoryById('${c.id}')">
            Edit
          </button>
          <button class="btn secondary" onclick="deleteCategory('${c.id}')">
            Delete
          </button>
        </div>
      </div>
      ${c.image_url ? `<img class="thumb" src="${c.image_url}">` : ``}
    </div>
  `).join("");
}


function renderProducts(list){
  productsList.innerHTML = list.map(p => `
    <div class="item">
      <div style="flex:1">
        <b>${escapeHtml(p.name)}</b>
        <div style="margin-top:6px;display:flex;gap:8px">
          <button class="btn secondary" onclick="editProductById('${p.id}')">
            Edit
          </button>
          <button class="btn secondary" onclick="deleteProduct('${p.id}')">
            Delete
          </button>
        </div>
      </div>
      ${p.image_url ? `<img class="thumb" src="${p.image_url}">` : ``}
    </div>
  `).join("");
}
async function deleteCategory(id){
  if(!confirm("Delete category and ALL products under it?")) return;

  await client.from("products").delete().eq("category_id", id);
  await client.from("categories").delete().eq("id", id);

  loadAll();
}

async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;

  await client.from("products").delete().eq("id", id);
  loadAll();
}


categorySearch.addEventListener("input", () => {
  const q = categorySearch.value.toLowerCase();
  renderCategories(
    categories.filter(c =>
      (c.name + " " + (c.description || "")).toLowerCase().includes(q)
    )
  );
});

productSearch.addEventListener("input", () => {
  const q = productSearch.value.toLowerCase();
  renderProducts(
    products.filter(p =>
      (p.name + " " + (p.description || "")).toLowerCase().includes(q)
    )
  );
});
function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}


/* EDIT */
// function editCategory(c){
//   catTitle.innerText="Edit Category";
//   cat_id.value=c.id;
//   cat_name.value=c.name;
//   cat_desc.value=c.description||"";
//   catImageUrl=c.image_url||"";
//   cat_preview.innerHTML=c.image_url?`<img src="${c.image_url}">`:"";
//   openCategoryModal();
// }

// function editProduct(p){
//   prodTitle.innerText="Edit Product";
//   prod_id.value=p.id;
//   prod_name.value=p.name;
//   prod_price.value=p.price;
//   prod_category.value=p.category_id;
//   prodImageUrl=p.image_url||"";
//   prod_preview.innerHTML=p.image_url?`<img src="${p.image_url}">`:"";
//   openProductModal();
// }

function editCategoryById(id){
  const c = categories.find(x => x.id === id);
  if(!c) return;

  catTitle.innerText = "Edit Category";
  cat_id.value = c.id;
  cat_name.value = c.name;
  cat_desc.value = c.description || "";
  catImageUrl = c.image_url || "";

  cat_preview.innerHTML = c.image_url
    ? `<img src="${c.image_url}">`
    : "";

  openCategoryModal();
}

function editProductById(id){
  const p = products.find(x => x.id === id);
  if(!p) return;

  prodTitle.innerText = "Edit Product";
  prod_id.value = p.id;
  prod_name.value = p.name;
  prod_price.value = p.price;
  prod_category.value = p.category_id;
  prodImageUrl = p.image_url || "";

  prod_preview.innerHTML = p.image_url
    ? `<img src="${p.image_url}">`
    : "";

  openProductModal();
}


/* SAVE */
async function saveCategory(){
  const data={
    name:cat_name.value,
    description:cat_desc.value,
    image_url:catImageUrl
  };
  cat_id.value
    ? await client.from("categories").update(data).eq("id",cat_id.value)
    : await client.from("categories").insert(data);
  closeCategoryModal();
  loadAll();
}

async function saveProduct(){
  const data={
    name:prod_name.value,
    price:+prod_price.value,
    category_id:prod_category.value,
    image_url:prodImageUrl
  };
  prod_id.value
    ? await client.from("products").update(data).eq("id",prod_id.value)
    : await client.from("products").insert(data);
  closeProductModal();
  loadAll();
}

/* ---------- SITE SETTINGS ---------- */
async function loadSettings(){
  const { data, error } = await client
    .from("site_settings")
    .select("*")
    .eq("id", SETTINGS_ID)
    .single();

  if(error){
    console.error("Settings load failed", error);
    return;
  }

  if(!data) return;

  set_whatsapp.value = data.whatsapp_number || "";
  set_phone1.value  = data.phone_primary || "";
  set_phone2.value  = data.phone_secondary || "";
  set_email.value   = data.email || "";
  set_address.value = data.address || "";
  set_map.value     = data.google_map_url || "";
  set_fb.value      = data.facebook_url || "";
  set_insta.value   = data.instagram_url || "";
  set_tw.value      = data.twitter_url || "";
}


async function saveSettings(){
  await client.from("site_settings").upsert({
    id: SETTINGS_ID,
    whatsapp_number: set_whatsapp.value,
    phone_primary: set_phone1.value,
    phone_secondary: set_phone2.value,
    email: set_email.value,
    address: set_address.value,
    google_map_url: set_map.value,
    facebook_url: set_fb.value,
    instagram_url: set_insta.value,
    twitter_url: set_tw.value,
    updated_at: new Date().toISOString()
  });
  alert("Settings saved");
}


loadAll();
loadSettings();
</script>
</body>

</html>
