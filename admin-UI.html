<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mahalaxmi Pickles</title>

<script src="./supabase.js"></script>

<style>
:root{
  --blue:#5c6fd6;
  --bg:#f6f7fb;
  --dark:#222;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  padding-bottom:70px;
}

/* ================= HEADER ================= */
header{
  background:var(--blue);
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}

.logo img{
  width:36px;
  height:36px;
  border-radius:8px;
}

.checkout-btn{
  background:#fff;
  color:var(--blue);
  border:none;
  padding:6px 14px;
  border-radius:22px;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
}

/* ================= LAYOUT ================= */
.container{
  width:95%;
  margin:auto;
}

/* ================= SLIDER ================= */
#sliderSection{margin:12px 0}

/* ================= SLIDER ================= */
.slider{
  position:relative;
  height:380px;          /* ⬅ Increased desktop height */
  border-radius:18px;
  overflow:hidden;
}

.slider img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slide-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:#fff;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.prev{left:12px}
.next{right:12px}
/* ================= SLIDER CAPTION ================= */

.slide-caption{
  margin-top:12px;
  padding:0 6px;
}

.slide-caption h2{
  margin:0;
  font-size:20px;
  font-weight:700;
  color:var(--dark);
}

.slide-caption p{
  margin-top:4px;
  font-size:14px;
  color:#555;
  line-height:1.4;
}

/* MOBILE */
@media (max-width:768px){
  .slide-caption h2{
    font-size:18px;
  }
  .slide-caption p{
    font-size:13px;
  }
}

/* MOBILE SLIDER */
@media (max-width:768px){
  .slider{
    height:240px;        /* ⬅ Increased mobile height */
    border-radius:14px;
  }
}
/* ================= SLIDER OVERLAY ================= */
.slide-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 16px;
  background:linear-gradient(
    rgba(0,0,0,0.35),
    rgba(0,0,0,0.35)
  );
  pointer-events:none; /* allow slider click */
}

.slide-overlay h2{
  margin:0;
  font-size:32px;
  font-weight:800;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

.slide-overlay p{
  margin-top:8px;
  font-size:16px;
  color:#f1f1f1;
  max-width:700px;
  line-height:1.4;
}

/* MOBILE */
@media (max-width:768px){
  .slide-overlay h2{
    font-size:22px;
  }
  .slide-overlay p{
    font-size:14px;
  }
}


/* ================= CATEGORIES ================= */
/* ALWAYS ONE PER ROW */
#categorySection{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
  margin-bottom:36px;
}

.category-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

/* DEFAULT (Laptop / Desktop) */
.category-card img{
  width:100%;
  height:320px;          /* makes banner tall enough */
  object-fit:cover;      /* full width banner */
  display:block;
}

@media (max-width: 768px){
  .category-card img{
    height:auto;         /* let image decide height */
    max-height:300px;    /* avoid very tall images */
    object-fit:contain; /* show full image */
    background:#fff;
  }
}


.category-card .info{
  padding:14px;
}

.category-card h3{
  margin:0;
  font-size:18px;
}

/* ================= PRODUCT PAGE ================= */
#productSection{display:none}

/* ================= BREADCRUMB ================= */
.breadcrumb{
  margin:14px 0;
  font-size:16px;
}

.breadcrumb-home{
  color: var(--blue);
  cursor: pointer;
  font-weight: 600;
}

.breadcrumb-home:hover{
  text-decoration: underline;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.controls input,
.controls select{
  padding:10px;
  border-radius:12px;
  border:1px solid #ccc;
}

.controls input{flex:1}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.product{
  background:#fff;
  border-radius:16px;
  padding:12px;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}

.add-btn,.qty-btn{
  width:100%;
  background:var(--blue);
  color:#fff;
  border:none;
  padding:10px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}

.qty-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.qty-btn{width:40px}

/* ================= MODALS ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:200;
}

.modal-box{
  background:#fff;
  width:420px;
  max-width:92%;
  border-radius:22px;
  padding:22px;
}

/* CART */
.cart-item{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.cart-item img{
  width:60px;
  height:60px;
  border-radius:8px;
}

.cart-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.cart-actions button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  cursor:pointer;
}

.whatsapp{background:#6dd47e;color:#fff}
.clear{background:#eee}
.close{background:#ddd}

/* ================= CUSTOMER POPUP ================= */
.customer-box h2{margin-bottom:16px}

.form-grid{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.form-grid input,
.form-grid textarea{
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:15px;
}

.customer-actions{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.send-btn{
  flex:1;
  background:#6dd47e;
  color:#fff;
  border:none;
  padding:12px;
  border-radius:14px;
  font-weight:600;
}

.cancel-btn{
  flex:1;
  background:#eee;
  border:none;
  padding:12px;
  border-radius:14px;
}

/* ================= MODERN FOOTER ================= */

.site-footer {
  background: linear-gradient(180deg, #f6f7fb, #ffffff);
  padding: 40px 16px 20px;
  margin-top: 50px;
}

.footer-card {
  width: 97%;              /* ⬅ almost full screen */
  max-width: 1400px;       /* ⬅ prevents ultra-wide stretching */
  margin: auto;
  background: #ffffff;
  border-radius: 18px;
  padding: 30px 24px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.06);
}

@media (max-width: 768px) {
  .footer-card {
    width: 95%;
    padding: 24px 18px;
  }
}


/* BLOCKS */
.footer-block h3 {
  margin-bottom: 12px;
  font-size: 18px;
  color: #222;
}

.footer-block p {
  font-size: 14px;
  line-height: 1.7;
  color: #555;
  margin-bottom: 12px;
}

/* LINKS */
.contact-link {
  display: block;
  margin-bottom: 8px;
  font-size: 15px;
  color: #444;
  text-decoration: none;
}

.contact-link:hover {
  color: #5c6fd6;
}

/* MAP BUTTON */
.map-btn {
  display: inline-block;
  margin-top: 6px;
  padding: 8px 14px;
  background: #5c6fd6;
  color: #fff;
  border-radius: 20px;
  font-size: 14px;
  text-decoration: none;
}

.map-btn:hover {
  background: #4a5bcc;
}

/* WHATSAPP BUTTON */
.whatsapp-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 10px 14px;
  background: #6dd47e;
  color: #fff;
  border-radius: 22px;
  text-decoration: none;
  font-weight: 600;
  width: fit-content;
}

.whatsapp-btn img {
  width: 20px;
  height: 20px;
}

/* SOCIAL ICONS */
.social-icons {
  display: flex;
  gap: 16px;
  margin-top: 12px;
}

.social-icons {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 10px;
}

.social-icons a img {
  width: 28px;
  height: 28px;
  transition: transform 0.2s ease;
}

.social-icons a:hover img {
  transform: scale(1.15);
}

.footer-bottom {
  margin-top: 30px;
  padding: 16px 10px;
  background: linear-gradient(90deg, #5c6fd6, #7b8cf1);
  text-align: center;
  font-size: 13px;
  color: #fff;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {
  .footer-card {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .whatsapp-btn {
    margin-left: auto;
    margin-right: auto;
  }

  .social-icons {
    justify-content: center;
  }
}

</style>
</head>

<body>
<header>
  <div class="logo" onclick="goHome()">
    <img src="./logo.jpeg">
    <div>
      <b>Mahalaxmi Pickles</b><br>
      <small>Authentic pickles & more</small>
    </div>
  </div>
  <button class="checkout-btn" onclick="openCart()">Checkout (<span id="cartCount">0</span>)</button>
</header>

<div class="container">

<section id="sliderSection">
  <div class="slider" onclick="openSliderCategory()">
    <img id="sliderImg">

    <!-- CENTER OVERLAY -->
    <div class="slide-overlay">
      <h2 id="slideTitle"></h2>
      <p id="slideDesc"></p>
    </div>

    <button class="slide-arrow prev" onclick="event.stopPropagation();prevSlide()">‹</button>
    <button class="slide-arrow next" onclick="event.stopPropagation();nextSlide()">›</button>
  </div>
</section>



<section id="categorySection"></section>

<section id="productSection">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="controls">
    <input id="search" placeholder="Search products" oninput="renderProducts()">
    <select id="sort" onchange="renderProducts()">
      <option value="">Sort</option>
      <option value="hl">High → Low</option>
      <option value="lh">Low → High</option>
    </select>
  </div>
  <div class="products" id="products"></div>
</section>

</div>

<!-- CART -->
<div class="modal" id="cartModal">
  <div class="modal-box">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <h4>Total ₹<span id="cartTotal">0</span></h4>
    <div class="cart-actions">
      <button class="whatsapp" onclick="openCustomerPopup()">Place Order</button>
      <button class="clear" onclick="clearCart()">Clear</button>
      <button class="close" onclick="closeCart()">Close</button>
    </div>
  </div>
</div>

<!-- CUSTOMER DETAILS -->
<div class="modal" id="customerModal">
  <div class="modal-box customer-box">
    <h2>Customer Details</h2>
    <div class="form-grid">
      <input id="custName" placeholder="Full Name">
      <input id="custPhone" placeholder="Phone Number">
      <input id="custEmail" placeholder="Email">
      <textarea id="custAddress" rows="3" placeholder="Detailed Address"></textarea>
    </div>
    <div class="customer-actions">
      <button class="send-btn" onclick="placeWhatsappOrder()">Send Order</button>
      <button class="cancel-btn" onclick="closeCustomerPopup()">Cancel</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-card">

    <!-- ADDRESS -->
    <div class="footer-block" id="footerAddress"></div>

    <!-- CONTACT -->
    <div class="footer-block" id="footerContact"></div>

    <!-- SOCIAL -->
    <div class="footer-block">
      <h3>🌐 Follow Us</h3>
      <div class="social-icons" id="socialIcons"></div>
    </div>

  </div>

  <div class="footer-bottom">
    © <span id="footerYear"></span> Mahalaxmi Pickles. All rights reserved.
  </div>
</footer>


<script>
const supabase = window.supabase.createClient(
  "https://mfbgnapfarkguogklunk.supabase.co",
  "sb_publishable_jhUG7EagF5vX6qi2wcxEwA_UB-ExHO8"
);

let categories=[],products=[],cart={},activeCat=null,slide=0,settings={};

const sliderImg=document.getElementById("sliderImg");

/* LOAD */
(async()=>{
  categories=(await supabase.from("categories").select("*")).data||[];
  products=(await supabase.from("products").select("*")).data||[];
  settings=(await supabase.from("site_settings").select("*").single()).data||{};
  renderCategories();
  startSlider();
  //renderFooter();
  //renderSocialIcons(); 
  renderFooterDynamic();
})();

const slideTitle = document.getElementById("slideTitle");
const slideDesc  = document.getElementById("slideDesc");

/* SLIDER */
function startSlider(){
  if(!categories.length) return;
  slide = 0;
  updateSlide();
  setInterval(nextSlide,4000);
}

function updateSlide(){
  const c = categories[slide];
  sliderImg.src = c.image_url;
  slideTitle.innerText = c.name;
  slideDesc.innerText = c.description || "";
}

function nextSlide(){
  slide = (slide + 1) % categories.length;
  updateSlide();
}

function prevSlide(){
  slide = (slide - 1 + categories.length) % categories.length;
  updateSlide();
}

function openSliderCategory(){
  openCategory(categories[slide].id);
}

function openSliderCategory(){openCategory(categories[slide].id)}

/* CATEGORIES */
function renderCategories(){
  const el=document.getElementById("categorySection");
  el.innerHTML="";
  categories.forEach(c=>{
    el.innerHTML+=`
      <div class="category-card" onclick="openCategory('${c.id}')">
        <img src="${c.image_url}">
        <div class="info"><h3>${c.name}</h3></div>
      </div>`;
  });
}

/* CATEGORY */
function openCategory(id){
  activeCat=categories.find(c=>c.id===id);
  document.getElementById("sliderSection").style.display="none";
  document.getElementById("categorySection").style.display="none";
  document.getElementById("productSection").style.display="block";
  document.getElementById("breadcrumb").innerHTML =
  `<span class="breadcrumb-home" onclick="goHome()">Home</span> → <b>${activeCat.name}</b>`;

  
  // 🔹 RESET SCROLL TO TOP
  window.scrollTo({
    top: 0,
    behavior: "smooth" // smooth feels premium
  });

  renderProducts();
}
function goHome(){
  document.getElementById("sliderSection").style.display="block";
  document.getElementById("categorySection").style.display="grid";
  document.getElementById("productSection").style.display="none";
}

/* PRODUCTS */
function renderProducts(){
  const q=document.getElementById("search").value.toLowerCase();
  let list=products.filter(p=>p.category_id===activeCat.id && p.name.toLowerCase().includes(q));
  document.getElementById("products").innerHTML=list.map(p=>{
    const c=cart[p.id];
    return `
    <div class="product">
      <img src="${p.image_url}">
      <b>${p.name}</b>
      <p>₹${p.price}</p>
      ${c?
      `<div class="qty-box">
        <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
        ${c.qty}
        <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
      </div>`:
      `<button class="add-btn" onclick="addToCart('${p.id}')">Add</button>`}
    </div>`;
  }).join("");
}

/* CART */
function addToCart(id){
  const p=products.find(x=>x.id===id);
  cart[id]?cart[id].qty++:(cart[id]={...p,qty:1});
  updateCart();
}

function changeQty(id, d){
  cart[id].qty += d;
  if(cart[id].qty <= 0) delete cart[id];
  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").innerText =
    Object.values(cart).reduce((s,i)=>s+i.qty,0);

  renderProducts();

  // 🔥 THIS IS THE MISSING PART
  if(document.getElementById("cartModal").style.display === "flex"){
    renderCart();
  }
}


function openCart(){
  if(!Object.keys(cart).length) return alert("Cart empty");
  document.getElementById("cartModal").style.display="flex";
  renderCart();
}
function closeCart(){document.getElementById("cartModal").style.display="none"}
function clearCart(){cart={};updateCart();closeCart()}
function renderCart(){
  let total = 0;

  document.getElementById("cartItems").innerHTML =
    Object.entries(cart).map(([id, item]) => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;

      return `
        <div class="cart-item">
          <img src="${item.image_url}">

          <div style="flex:1">
            <b>${item.name}</b>
            <p>₹${item.price}</p>

            <!-- QTY CONTROLS -->
            <div class="qty-box" style="margin-top:6px">
              <button class="qty-btn" onclick="changeQty('${id}', -1)">−</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
            </div>
          </div>

          <div style="font-weight:600">
            ₹${itemTotal}
          </div>
        </div>
      `;
    }).join("");

  document.getElementById("cartTotal").innerText = total;
}

/* CUSTOMER */
function openCustomerPopup(){document.getElementById("customerModal").style.display="flex"}
function closeCustomerPopup(){document.getElementById("customerModal").style.display="none"}

function placeWhatsappOrder(){
  const name = custName.value.trim();
  const phone = custPhone.value.trim();
  const email = custEmail.value.trim();
  const addr = custAddress.value.trim();

  /* ================= VALIDATIONS ================= */

  if (!name) {
    alert("Please enter your name");
    return;
  }

  if (!/^\d{10}$/.test(phone)) {
    alert("Phone number must be exactly 10 digits");
    return;
  }

  if (email && !/^[^@]+@[^@]+\.(com|in)$/i.test(email)) {
    alert("Please enter a valid email (.com or .in)");
    return;
  }

  if (!addr) {
    alert("Please enter your address");
    return;
  }

  if (!settings.whatsapp_number) {
    alert("Admin WhatsApp number not configured");
    return;
  }

  /* ================= SANITIZE WHATSAPP NUMBER ================= */

  // Remove all non-digits
  let waNumber = settings.whatsapp_number.replace(/\D/g, "");

  // Ensure country code (India: 91)
  if (waNumber.length === 10) {
    waNumber = "91" + waNumber;
  }

  // Final validation
  if (waNumber.length < 11) {
    alert("Invalid admin WhatsApp number");
    return;
  }

  /* ================= MESSAGE BUILD ================= */

  let msg = `New Order Received!\n`;
  msg += `--------------------------------\n`;
  msg += `Customer Name: ${name}\n`;
  msg += `Phone: ${phone}\n`;
  msg += `Email: ${email || "-"}\n`;
  msg += `Address: ${addr}\n`;
  msg += `--------------------------------\n`;
  msg += `Items Ordered:\n`;

  let total = 0;
  let index = 1;

  Object.values(cart).forEach(item => {
    const itemTotal = item.price * item.qty;
    total += itemTotal;
    msg += `${index}. ${item.name} — Qty: ${item.qty} — ₹${itemTotal}\n`;
    index++;
  });

  msg += `--------------------------------\n`;
  msg += `Total Amount: ₹${total}\n`;
  msg += `--------------------------------\n`;
  msg += `Thank you!`;

  /* ================= OPEN WHATSAPP DIRECTLY ================= */

  const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;

  window.open(waUrl, "_blank");

  /* ================= CLEANUP ================= */

  clearCart();
  closeCustomerPopup();
  closeCart();
}


function renderFooter(){
  let html = "";

  /* WHATSAPP (icon + number) */
  if(settings.whatsapp_number){
    let wa = settings.whatsapp_number.replace(/\D/g,'');
    if(wa.length === 10) wa = "91" + wa;

    html += `
      <a class="footer-item" href="https://wa.me/${wa}" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
        <span>${settings.whatsapp_number}</span>
      </a>`;
  }

  /* PHONE (icon + number) */
  // if(settings.phone){
  //   html += `
  //     <a class="footer-item" href="tel:${settings.phone}">
  //       <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Phone_font_awesome.svg">
  //       <span>${settings.phone}</span>
  //     </a>`;
  // }

  /* INSTAGRAM */
  if(settings.instagram_url){
    html += `
      <a class="footer-item" href="${settings.instagram_url}" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
      </a>`;
  }

  /* FACEBOOK */
  if(settings.facebook_url){
    html += `
      <a class="footer-item" href="${settings.facebook_url}" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg">
      </a>`;
  }

  /* TWITTER / X */
  if(settings.twitter_url){
    html += `
      <a class="footer-item" href="${settings.twitter_url}" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg">
      </a>`;
  }

  /* EMAIL (icon + text) */
  if(settings.email){
    html += `
      <a class="footer-item" href="mailto:${settings.email}">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg">
        <span>${settings.email}</span>
      </a>`;
  }

  document.getElementById("footer").innerHTML = html;
}

function normalizeUrl(url) {
  if (!url) return null;
  if (url.startsWith("http://") || url.startsWith("https://")) return url;
  return "https://" + url;
}

function renderSocialIcons() {
  const el = document.getElementById("socialIcons");
  if (!el) return;

  let html = "";

  // Instagram
  const insta = normalizeUrl(settings.instagram_url);
  if (insta) {
    html += `
      <a href="${insta}" target="_blank" rel="noopener noreferrer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
      </a>`;
  }

  // Facebook
  const fb = normalizeUrl(settings.facebook_url);
  if (fb) {
    html += `
      <a href="${fb}" target="_blank" rel="noopener noreferrer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Facebook_icon.svg" alt="Facebook">
      </a>`;
  }

  // Twitter
  const tw = normalizeUrl(settings.twitter_url);
  if (tw) {
    html += `
      <a href="${tw}" target="_blank" rel="noopener noreferrer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" alt="Twitter">
      </a>`;
  }

  // Email
  if (settings.email) {
    html += `
      <a href="mailto:${settings.email}">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="Email">
      </a>`;
  }

  el.innerHTML = html;
}

function renderFooterDynamic() {

  /* ================= ADDRESS ================= */
  const addrEl = document.getElementById("footerAddress");
  if (settings.address) {
    addrEl.innerHTML = `
      <h3>📍 Address</h3>
      <p>${settings.address.replace(/\n/g, "<br>")}</p>
      ${
        settings.google_map_url
          ? `<a href="${settings.google_map_url}" target="_blank" class="map-btn">
               View on Google Maps
             </a>`
          : ""
      }
    `;
  }

  /* ================= CONTACT ================= */
  const contactEl = document.getElementById("footerContact");
  let contactHtml = `<h3>📞 Contact</h3>`;

  if (settings.phone_primary) {
    contactHtml += `
      <a href="tel:${settings.phone_primary}" class="contact-link">
        📞 ${settings.phone_primary}
      </a>`;
  }

  if (settings.phone_secondary) {
    contactHtml += `
      <a href="tel:${settings.phone_secondary}" class="contact-link">
        📞 ${settings.phone_secondary}
      </a>`;
  }

  if (settings.whatsapp_number) {
    let wa = settings.whatsapp_number.replace(/\D/g, "");
    if (wa.length === 10) wa = "91" + wa;

    contactHtml += `
      <a href="https://wa.me/${wa}" target="_blank" class="whatsapp-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
        Order via WhatsApp
      </a>`;
  }

  contactEl.innerHTML = contactHtml;

  /* ================= SOCIAL ICONS ================= */
  renderSocialIcons();

  /* ================= YEAR ================= */
  document.getElementById("footerYear").innerText = new Date().getFullYear();
}


</script>
</body>
</html>
